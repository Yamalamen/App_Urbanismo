<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor Urbanístico Novelda</title>
<!--@@HEAD_START@@-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
<style>/*@@LEAFLET_CSS@@*/</style>
<style>
/* Layout: panel guiado a la izquierda + mapa a la derecha; en móvil, mapa arriba y panel abajo. */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#18262b; --muted:#56676d; --line:#dfe5e3;
  --brand:#0d6b67; --brand-ink:#ffffff; --brand-soft:#e0efed; --accent:#c4562c;
  --si:#237a49; --si-soft:#e1f2e7; --no:#b3372b; --no-soft:#fbe5e2; --cond:#9a6700; --cond-soft:#fdf1d3;
  --ej:#7a5300; --ej-soft:#fff1cc; --real:#1d6a3a; --real-soft:#e0f2e6;
  --map-bg:#e7ecea; --map-grid:rgba(13,107,103,.08);
  --shadow:0 8px 24px rgba(16,30,34,.12);
  --f-head:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11181a; --panel:#182225; --ink:#ebf2f2; --muted:#9fb0b4; --line:#2a383c;
  --brand:#45b5aa; --brand-ink:#0b1a19; --brand-soft:#16332f; --accent:#e88a62;
  --si:#6fd197; --si-soft:#153222; --no:#f08b80; --no-soft:#3a1a17; --cond:#f0c25c; --cond-soft:#36290c;
  --ej:#f3c66b; --ej-soft:#3a2f14; --real:#7fd59d; --real-soft:#163322;
  --map-bg:#1a2427; --map-grid:rgba(69,181,170,.10);
  --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11181a; --panel:#182225; --ink:#ebf2f2; --muted:#9fb0b4; --line:#2a383c;
  --brand:#45b5aa; --brand-ink:#0b1a19; --brand-soft:#16332f; --accent:#e88a62;
  --si:#6fd197; --si-soft:#153222; --no:#f08b80; --no-soft:#3a1a17; --cond:#f0c25c; --cond-soft:#36290c;
  --ej:#f3c66b; --ej-soft:#3a2f14; --real:#7fd59d; --real-soft:#163322;
  --map-bg:#1a2427; --map-grid:rgba(69,181,170,.10);
  --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.logo{width:36px;height:36px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;flex:none}
.htitle{font-family:var(--f-head);font-weight:700;font-size:1.05rem;line-height:1.2}
.hsub{font-size:.78rem;color:var(--muted)}
.badge-demo{margin-left:auto;background:var(--ej-soft);color:var(--ej);border:1px solid currentColor;border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.hbtn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-size:.85rem}
main{position:relative;display:grid;grid-template-columns:minmax(360px,460px) 1fr;min-height:0}
#panel{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:20px;min-height:0}
#map{min-height:0;background:var(--map-bg)}
#map.esquema{background-color:var(--map-bg);background-image:linear-gradient(var(--map-grid) 1px,transparent 1px),linear-gradient(90deg,var(--map-grid) 1px,transparent 1px);background-size:40px 40px}
.leaflet-container{font:inherit}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:.15em 0 .35em;line-height:1.2}
h1{font-size:1.65rem} h2{font-size:1.3rem} h3{font-size:1.02rem;margin-top:1.1em}
p{margin:.35em 0 .8em}
.muted{color:var(--muted)}
.big{font-size:1.08rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:1rem}
.btn-primary{background:var(--brand);color:var(--brand-ink);box-shadow:var(--shadow)}
.btn-ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn-row .btn{flex:1 1 170px}
.cards{display:grid;gap:10px;margin-top:10px}
.card{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;transition:border-color .15s}
.card:hover{border-color:var(--brand)}
.card .ico{font-size:1.7rem;width:50px;height:50px;display:grid;place-items:center;background:var(--brand-soft);border-radius:14px;flex:none}
.card b{display:block;font-size:1rem}
.card span span{font-size:.85rem;color:var(--muted)}
.steps{display:flex;gap:6px;margin:6px 0 12px}
.steps button{flex:1;height:8px;border-radius:4px;background:var(--line);border:0;padding:0}
.steps button.on{background:var(--brand)}
.qnum{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:999px;font-weight:800;font-size:.76rem;padding:3px 10px;letter-spacing:.02em}
.answer{border-radius:16px;padding:16px;background:var(--brand-soft);margin:10px 0}
.answer .eyebrow{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.answer .t{font-family:var(--f-head);font-size:1.35rem;font-weight:700;line-height:1.2}
.answer .t2{font-weight:700;font-size:1.05rem;margin-top:2px}
.tag{display:inline-block;font-size:.64rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 6px;vertical-align:middle;margin-left:6px;white-space:nowrap}
.tag.ejemplo{background:var(--ej-soft);color:var(--ej)}
.tag.real{background:var(--real-soft);color:var(--real)}
.list{display:grid;gap:8px;margin:8px 0}
details.item{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
details.item>summary{list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;cursor:pointer}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary .k{color:var(--muted);font-size:.9rem;min-width:0}
details.item>summary .v{font-weight:700;text-align:right;min-width:0}
details.item>summary::after{content:"ⓘ";color:var(--brand);font-size:.9rem;flex:none}
details.item[open]>summary::after{content:"✕"}
details.item .more{padding:0 12px 12px;font-size:.88rem;color:var(--muted);display:grid;gap:6px}
details.item .more b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.8rem;white-space:nowrap}
.pill.afecta,.pill.no{background:var(--no-soft);color:var(--no)}
.pill.no_afecta,.pill.si{background:var(--si-soft);color:var(--si)}
.pill.condiciones,.pill.en_curso{background:var(--cond-soft);color:var(--cond)}
.pill.hecho{background:var(--si-soft);color:var(--si)}
.pill.pendiente{background:var(--line);color:var(--muted)}
.calc{border:1px dashed var(--brand);border-radius:12px;padding:12px 14px;margin:10px 0;font-variant-numeric:tabular-nums}
.calc ol{margin:.3em 0 0;padding-left:1.2em;display:grid;gap:4px}
.chain{list-style:none;margin:8px 0;padding:0;display:grid;gap:0}
.chain li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 0;position:relative}
.chain li::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--line);justify-self:center;z-index:1}
.chain li.hecho::before{background:var(--si)} .chain li.en_curso::before{background:var(--cond)}
.chain li:not(:last-child)::after{content:"";position:absolute;left:10px;top:28px;bottom:-8px;width:2px;background:var(--line)}
.legend{display:grid;gap:4px;font-size:.84rem;margin:12px 0;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}
.src{font-size:.82rem;color:var(--muted);border-left:3px solid var(--brand);padding:6px 10px;margin:12px 0;background:var(--bg);border-radius:0 8px 8px 0}
.nav{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:-20px;background:var(--panel);padding:12px 0 20px}
.nav .btn{flex:1}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.back{background:none;border:0;color:var(--muted);padding:4px 0;font-size:.9rem}
.benefit{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
.benefit .ico{font-size:1.4rem;width:40px;height:40px;display:grid;place-items:center;background:var(--brand-soft);border-radius:12px;flex:none}
.mapnote{position:absolute;left:12px;bottom:28px;z-index:700;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.76rem;max-width:min(360px,70%);box-shadow:var(--shadow)}
.layers{position:absolute;top:12px;right:12px;z-index:700;display:flex;flex-direction:column;gap:6px}
.layers button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;font-size:.86rem;box-shadow:var(--shadow);text-align:left}
.layers button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pulse{width:24px;height:24px;border-radius:50%;background:var(--accent);border:4px solid var(--panel);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(196,86,44,.55)}70%{box-shadow:0 0 0 24px rgba(196,86,44,0)}100%{box-shadow:0 0 0 0 rgba(196,86,44,0)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
.leaflet-tooltip.lbl{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;font-weight:700;font-size:.8rem;box-shadow:var(--shadow)}
.leaflet-tooltip.lbl::before{display:none}
/* Informe */
#report{position:fixed;inset:0;background:rgba(8,14,16,.6);z-index:2000;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px}
#report:not([hidden]){display:flex}
.sheet{background:var(--panel);color:var(--ink);max-width:780px;width:100%;border-radius:14px;padding:28px;position:relative;overflow:hidden}
.sheet h3{margin:0 0 4px;font-size:1.35rem}
.sheet .tbl{overflow-x:auto}
.sheet table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem}
.sheet td,.sheet th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.sheet th{width:38%;color:var(--muted);font-weight:600}
.sheet .sec td{background:var(--brand-soft);font-weight:800;font-family:var(--f-head)}
.watermark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:5.5rem;font-weight:900;color:var(--accent);opacity:.08;transform:rotate(-24deg);white-space:nowrap}
.sheet .foot{font-size:.78rem;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media print{
  body *{visibility:hidden}
  #report,#report *{visibility:visible}
  #report{position:absolute;inset:0;background:#fff;padding:0;display:block}
  .sheet-actions{display:none}
}
@media (max-width:820px){
  html,body{font-size:15.5px}
  main{grid-template-columns:1fr;grid-template-rows:38vh minmax(0,1fr)}
  #map{grid-row:1}
  #panel{grid-row:2}
  #panel{border-right:0;border-top:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  header{padding:8px 12px;gap:8px}
  .hsub{display:none}
  .logo{width:30px;height:30px}
  .htitle{font-size:.92rem}
  .badge-demo{font-size:.6rem;padding:3px 7px}
  .hbtn{padding:5px 8px;font-size:.78rem}
  .layers{top:8px;right:8px;gap:4px}
  .layers button{padding:5px 8px;font-size:.74rem;border-radius:9px}
  .leaflet-control-attribution{font-size:9px}
  .mapnote{font-size:.68rem;left:8px;bottom:22px}
  .nav{bottom:-16px}
  .nav .btn{font-size:.95rem;padding:12px 14px}
  .long{display:none}
  .sheet{padding:18px}
}
</style>
<!--@@HEAD_END@@-->
</head>
<body>
<!--@@BODY_START@@-->
<div id="app">
  <header>
    <div class="logo" aria-hidden="true">N</div>
    <div>
      <div class="htitle">Visor Urbanístico · Novelda</div>
      <div class="hsub">Propuesta de UrbanGPT para el municipio</div>
    </div>
    <span class="badge-demo" title="Versión de demostración con datos de ejemplo">DEMOSTRACIÓN</span>
    <button class="hbtn" id="homeBtn" type="button">Inicio</button>
  </header>
  <main>
    <section id="panel" aria-live="polite"></section>
    <div id="map" role="application" aria-label="Mapa de Novelda"></div>
  </main>
</div>
<div id="report" role="dialog" aria-modal="true" aria-label="Informe de ejemplo" hidden></div>

<script>/*@@LEAFLET_JS@@*/</script>
<script>/*@@CASOS_JS@@*/</script>
<script>
(function(){
"use strict";
var D = window.NOVELDA_DEMO;
var panel = document.getElementById("panel");
var reportEl = document.getElementById("report");
var mapEl = document.getElementById("map");
var EMBEBIDO = (function(){ try { return window.self !== window.top; } catch(e){ return true; } })();

/* ================= Mapa ================= */
var map = L.map("map",{zoomControl:true}).setView(D.centro, D.zoomInicial);
L.control.scale({imperial:false, position:"bottomright"}).addTo(map);
var callejero = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19, attribution:"© OpenStreetMap"});
var orto = L.tileLayer.wms("https://www.ign.es/wms-inspire/pnoa-ma",{layers:"OI.OrthoimageCoverage", format:"image/jpeg", maxZoom:20, attribution:"PNOA © IGN"});
var catastro = L.tileLayer.wms("https://ovc.catastro.meh.es/Cartografia/WMS/ServidorWMS.aspx",{layers:"Catastro", format:"image/png", transparent:true, maxZoom:20, attribution:"© D. G. del Catastro"});
var okTiles = 0, badTiles = 0, esquema = false;
[callejero, orto, catastro].forEach(function(l){
  l.on("tileload",function(){ okTiles++; if(esquema){ esquema=false; mapEl.classList.remove("esquema"); var n=document.querySelector(".mapnote"); if(n) n.remove(); } });
  l.on("tileerror",function(){ badTiles++; if(badTiles>=4 && okTiles===0 && !esquema) activarEsquema(); });
});
callejero.addTo(map);
function activarEsquema(){
  esquema = true; mapEl.classList.add("esquema");
  var n = document.createElement("div"); n.className="mapnote";
  n.textContent = "Plano esquemático: los puntos están en su posición real y a escala. El fondo cartográfico oficial se carga en el visor final.";
  mapEl.appendChild(n);
}

var layersBox = L.DomUtil.create("div","layers");
layersBox.innerHTML =
  '<button type="button" data-l="callejero" aria-pressed="true">Callejero</button>'+
  '<button type="button" data-l="orto" aria-pressed="false">Foto aérea</button>'+
  '<button type="button" data-l="catastro" aria-pressed="false">Parcelas</button>';
mapEl.appendChild(layersBox);
L.DomEvent.disableClickPropagation(layersBox);
layersBox.addEventListener("click",function(e){
  var b = e.target.closest("button"); if(!b) return;
  var k = b.getAttribute("data-l");
  if(k==="catastro"){ setCatastro(b.getAttribute("aria-pressed")!=="true"); return; }
  setBase(k);
});
function btn(k){ return layersBox.querySelector('[data-l="'+k+'"]'); }
function setBase(k){
  var on = k==="orto" ? orto : callejero, off = k==="orto" ? callejero : orto;
  if(map.hasLayer(off)) map.removeLayer(off);
  if(!map.hasLayer(on)){ on.addTo(map); on.bringToBack(); }
  btn("callejero").setAttribute("aria-pressed", String(k==="callejero"));
  btn("orto").setAttribute("aria-pressed", String(k==="orto"));
}
function setCatastro(v){
  if(v && !map.hasLayer(catastro)) catastro.addTo(map);
  if(!v && map.hasLayer(catastro)) map.removeLayer(catastro);
  btn("catastro").setAttribute("aria-pressed", String(v));
}

var pulseIcon = L.divIcon({className:"", html:'<div class="pulse"></div>', iconSize:[24,24], iconAnchor:[12,12]});
var contornos = {};
D.casos.forEach(function(c){
  var m = L.marker(c.coords,{icon:pulseIcon, title:c.lugar, keyboard:true}).addTo(map);
  m.bindTooltip(c.icono+" "+esc(c.titulo),{direction:"top",offset:[0,-12],className:"lbl"});
  m.on("click",function(){ startCase(c.id); });
  contornos[c.id] = contorno(c);
});
/* Contorno ilustrativo: cuadrado con la superficie de ejemplo, centrado en el punto. */
function contorno(c){
  var sup = parseFloat(String(dato(c.parcela,"Superficie de la parcela")).replace(/\./g,"").replace(",","."));
  if(!(sup>0)) return null;
  var lado = Math.sqrt(sup), dLat = (lado/2)/111320, dLng = (lado/2)/(111320*Math.cos(c.coords[0]*Math.PI/180));
  return L.rectangle([[c.coords[0]-dLat,c.coords[1]-dLng],[c.coords[0]+dLat,c.coords[1]+dLng]],
    {color:"#c4562c", weight:3, dashArray:"6 6", fillOpacity:.12})
    .bindTooltip("Contorno ilustrativo de la parcela de ejemplo",{sticky:true});
}
var contornoActivo = null;
function mostrarContorno(id){
  if(contornoActivo){ map.removeLayer(contornoActivo); contornoActivo=null; }
  if(id && contornos[id]){ contornoActivo = contornos[id].addTo(map); }
}

var freeMarker = null;
map.on("click",function(e){
  if(state.view!=="libre") return;
  if(freeMarker) map.removeLayer(freeMarker);
  freeMarker = L.marker(e.latlng,{icon:pulseIcon}).addTo(map);
  renderLibre(e.latlng);
});

/* ================= Utilidades ================= */
var state = {view:"inicio", caso:null, paso:0};
var PASOS = ["¿Dónde está?","¿Qué suelo es?","¿Qué le afecta?","¿Qué se puede hacer?","Informe"];
var ESTADO_TXT = {afecta:"Le afecta", no_afecta:"No le afecta", si:"Sí", no:"No", condiciones:"Con condiciones", hecho:"Hecho", en_curso:"En curso", pendiente:"Pendiente"};

function esc(s){ return String(s).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];}); }
function tagEj(){ return '<span class="tag ejemplo">Ejemplo</span>'; }
function tagReal(){ return '<span class="tag real">Dato real</span>'; }
function caso(id){ for(var i=0;i<D.casos.length;i++) if(D.casos[i].id===id) return D.casos[i]; return null; }
function dato(pares,k){ for(var i=0;i<pares.length;i++) if(pares[i][0]===k) return pares[i][1]; return ""; }
function pill(e){ return '<span class="pill '+e+'">'+ESTADO_TXT[e]+'</span>'; }
function fuenteFinal(){ return "En el visor final: "+esc(D.instrumento.nombre)+", con el artículo exacto de la norma de zona."; }

/* Fila consultable: se despliega con la explicación y el origen del dato */
function item(k, v, extra, opts){
  opts = opts || {};
  var explica = extra || D.glosario[k] || "";
  return '<details class="item"><summary><span class="k">'+esc(k)+'</span><span class="v">'+v+(opts.real?tagReal():tagEj())+'</span></summary>'+
    '<div class="more">'+(explica?'<div><b>¿Qué significa?</b> '+esc(explica)+'</div>':'')+
    '<div><b>¿De dónde sale?</b> '+(opts.fuente||fuenteFinal())+'</div></div></details>';
}
function itemsParcela(c){
  return c.parcela.map(function(p){ return item(p[0], esc(p[1]), null, {fuente:"En el visor final: Sede Electrónica del Catastro, consultada en el momento."}); }).join("");
}
function itemsParam(c){ return c.parametros.map(function(p){ return item(p[0], esc(p[1])); }).join(""); }
function itemsAfec(c){
  return c.afecciones.map(function(a){
    return '<details class="item"><summary><span class="k">'+esc(a.nombre)+'</span><span class="v">'+pill(a.estado)+tagEj()+'</span></summary>'+
      '<div class="more"><div><b>Detalle:</b> '+esc(a.detalle)+'</div><div><b>¿De dónde sale?</b> En el visor final: la cartografía oficial del organismo competente, cruzada con la parcela.</div></div></details>';
  }).join("");
}
function itemsPuede(c){
  return c.puede.map(function(q){
    return '<details class="item"><summary><span class="k">'+esc(q.pregunta)+'</span><span class="v">'+pill(q.resp)+tagEj()+'</span></summary>'+
      '<div class="more"><div>'+esc(q.detalle)+'</div><div><b>¿De dónde sale?</b> '+fuenteFinal()+'</div></div></details>';
  }).join("");
}
function bloqueCalculo(c){
  return '<div class="calc"><b>'+esc(c.calculo.titulo)+'</b>'+tagEj()+'<ol>'+c.calculo.pasos.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ol></div>';
}
function bloqueGestion(c){
  if(!c.gestion) return "";
  return '<h3>¿En qué punto está el desarrollo del sector?</h3><ul class="chain">'+c.gestion.map(function(g){
    return '<li class="'+g.estado+'"><span>'+esc(g.hito)+'</span>'+pill(g.estado)+'</li>';
  }).join("")+'</ul><p class="muted" style="font-size:.86rem">Cada paso se comprueba por separado: que un plan esté aprobado no significa que las obras estén terminadas.'+tagEj()+'</p>';
}
function lugarHtml(c){
  return c.real ? esc(c.lugar)+tagReal() : esc(c.lugar)+'<span class="tag ejemplo">Ubicación ilustrativa</span>';
}

/* ================= Vistas ================= */
function irA(c, z){ map.flyTo(c, z, {duration:1.2}); }
function scrollTop(){ panel.scrollTop = 0; }
function bindBack(id, fn){ var el=document.getElementById(id); if(el) el.onclick=fn; }

function renderInicio(){
  state = {view:"inicio", caso:null, paso:0};
  mostrarContorno(null); setCatastro(false); setBase("callejero");
  irA(D.centro, D.zoomInicial);
  panel.innerHTML =
    '<span class="qnum">Bienvenida</span>'+
    '<h1>La información urbanística de Novelda, clara y en un clic</h1>'+
    '<p class="big">Cualquier vecino, empresa o técnico puede saber <b>qué puede hacer en su parcela</b> sin ir al Ayuntamiento, con el documento oficial que lo respalda.</p>'+
    '<div class="btn-row"><button class="btn btn-primary" id="goTour" type="button">▶ Empezar la demostración</button></div>'+
    '<h3>O elija uno de los 5 ejemplos</h3>'+
    '<div class="cards">'+ D.casos.map(function(c){
      return '<button class="card" type="button" data-caso="'+c.id+'"><span class="ico" aria-hidden="true">'+c.icono+'</span><span><b>'+esc(c.titulo)+'</b><span>'+esc(c.persona)+'</span></span></button>';
    }).join("") +'</div>'+
    '<div class="btn-row"><button class="btn btn-ghost" id="goLibre" type="button">Explorar el mapa libremente</button></div>'+
    '<div class="legend"><b>Cómo leer esta demostración</b>'+
      '<div>'+tagReal()+' dato comprobado, con su fuente.</div>'+
      '<div>'+tagEj()+' valor de ejemplo para enseñar cómo funciona. No es un dato oficial de Novelda.</div>'+
      '<div>Toque cualquier dato para ver qué significa y de dónde sale.</div></div>';
  document.getElementById("goTour").onclick = function(){ startCase(D.casos[0].id); };
  document.getElementById("goLibre").onclick = renderLibre0;
  panel.querySelectorAll("[data-caso]").forEach(function(b){ b.onclick=function(){ startCase(b.getAttribute("data-caso")); }; });
  scrollTop();
}

function startCase(id){ state = {view:"caso", caso:id, paso:0}; renderPaso(); }

function renderPaso(){
  var c = caso(state.caso), p = state.paso;
  var steps = '<div class="steps" role="tablist" aria-label="Pasos">'+PASOS.map(function(t,i){
    return '<button type="button" role="tab" aria-label="'+esc(t)+'" aria-selected="'+(i===p)+'" class="'+(i<=p?"on":"")+'" data-paso="'+i+'"></button>';
  }).join("")+'</div>';
  var head = '<button class="back" type="button" id="toInicio">← Todos los ejemplos</button>'+steps+
             '<span class="qnum">'+c.icono+' Paso '+(p+1)+' de '+PASOS.length+' · '+esc(PASOS[p])+'</span>';
  var body = "";
  if(p===0){
    mostrarContorno(c.id); setBase("callejero"); setCatastro(false); irA(c.coords, c.zoom);
    body = '<h2>'+esc(c.titulo)+'</h2><p class="muted">'+esc(c.persona)+'</p>'+
      '<div class="answer"><div class="eyebrow">Ubicación</div><div class="t">'+lugarHtml(c)+'</div></div>'+
      '<p>Basta con <b>escribir la dirección o la referencia catastral</b>, o tocar la parcela en el mapa.</p>'+
      '<h3>Datos de la parcela</h3><div class="list">'+itemsParcela(c)+'</div>'+
      '<div class="src">'+(c.real ? "Ubicación: "+esc(c.real.lugar)+"." : "Ubicación ilustrativa: no corresponde a un sector concreto de Novelda.")+'</div>';
  } else if(p===1){
    mostrarContorno(c.id); setBase("orto"); setCatastro(true); irA(c.coords, Math.min(c.zoom+1,19));
    body = '<div class="answer"><div class="eyebrow">Clase de suelo</div><div class="t">'+esc(c.suelo.clase)+tagEj()+'</div>'+
      '<div class="t2">Zona: '+esc(c.suelo.zona)+'</div><p style="margin:.5em 0 0">'+esc(c.suelo.explicacion)+'</p></div>'+
      '<div class="list">'+item("Clase de suelo", esc(c.suelo.clase))+item("Zona", esc(c.suelo.zona))+'</div>'+
      bloqueGestion(c)+
      '<div class="src">En el visor final, este dato sale de las <b>'+esc(D.instrumento.nombre)+'</b> ('+esc(D.instrumento.detalle)+')'+tagReal()+'</div>';
  } else if(p===2){
    var n = c.afecciones.filter(function(a){return a.estado==="afecta";}).length;
    body = '<div class="answer"><div class="eyebrow">Resumen</div><div class="t">'+n+' de '+c.afecciones.length+' le afectan'+tagEj()+'</div></div>'+
      '<p>El visor cruza la parcela con las protecciones y los riesgos oficiales. Toque cada línea para ver el detalle.</p>'+
      '<div class="list">'+itemsAfec(c)+'</div>'+
      '<p class="muted" style="font-size:.86rem">En el visor final, «No le afecta» solo aparece cuando se ha comprobado con la fuente oficial. Si algo no se ha podido comprobar, se indica como pendiente.</p>';
  } else if(p===3){
    body = '<h2>Lo que de verdad quiere saber</h2><div class="list">'+itemsPuede(c)+'</div>'+
      bloqueCalculo(c)+
      '<h3>Normas que se aplican</h3><div class="list">'+itemsParam(c)+'</div>'+
      '<h3>Trámite orientativo</h3><ul>'+c.tramites.map(function(t){return '<li>'+esc(t)+'</li>';}).join("")+'</ul>';
  } else {
    body = '<h2>Un informe listo para descargar</h2>'+
      '<p class="big">Con un clic, el vecino obtiene un <b>informe en PDF</b> con todo lo anterior y las fuentes que lo respaldan.</p>'+
      '<div class="btn-row"><button class="btn btn-primary" type="button" id="openReport">Ver el informe de ejemplo</button></div>'+
      '<p class="muted" style="margin-top:14px">El informe es orientativo: no sustituye a la cédula urbanística, la licencia ni los certificados municipales.</p>';
  }
  var last = p===PASOS.length-1;
  var idx = D.casos.indexOf(c), nextCase = D.casos[idx+1];
  var nav = '<div class="nav">'+
    (p>0 ? '<button class="btn btn-ghost" type="button" id="prev">← Atrás</button>' : '')+
    (!last ? '<button class="btn btn-primary" type="button" id="next"><span>Siguiente<span class="long">: '+esc(PASOS[p+1])+'</span> →</span></button>'
           : (nextCase ? '<button class="btn btn-primary" type="button" id="nextCase">Siguiente ejemplo '+nextCase.icono+'</button>'
                       : '<button class="btn btn-primary" type="button" id="toFin">Ver resumen ✓</button>'))+
    '</div>';
  var ficha = '<button class="linkbtn" type="button" id="verFicha">Ver la ficha completa de este ejemplo</button>';
  panel.innerHTML = head + body + ficha + nav;
  bindBack("toInicio", renderInicio);
  panel.querySelectorAll("[data-paso]").forEach(function(b){ b.onclick=function(){ state.paso=+b.getAttribute("data-paso"); renderPaso(); }; });
  bindBack("prev", function(){ state.paso--; renderPaso(); });
  bindBack("next", function(){ state.paso++; renderPaso(); });
  bindBack("nextCase", function(){ startCase(nextCase.id); });
  bindBack("toFin", renderFin);
  bindBack("openReport", function(){ openReport(c); });
  bindBack("verFicha", function(){ openReport(c); });
  scrollTop();
}

function renderFin(){
  state = {view:"fin", caso:null, paso:0};
  mostrarContorno(null); setCatastro(false); setBase("callejero"); irA(D.centro, D.zoomInicial);
  panel.innerHTML =
    '<button class="back" type="button" id="toInicio">← Volver al inicio</button>'+
    '<span class="qnum">Resumen</span>'+
    '<h1>¿Qué gana el Ayuntamiento de Novelda?</h1>'+
    benefit("⏱","Menos consultas en el mostrador","Las preguntas repetidas, como «¿qué puedo hacer en mi casa?», se responden solas, las 24 horas.")+
    benefit("✓","Más transparencia","Cada respuesta indica de qué documento oficial sale. El vecino confía y los técnicos municipales lo pueden revisar.")+
    benefit("☺","Fácil para cualquiera","Preguntas sencillas y respuestas claras, en el móvil o en el ordenador, sin conocimientos técnicos.")+
    benefit("⚑","Sin sorpresas","Si un dato no está comprobado, el visor lo dice. Nunca da por hecho lo que no consta.")+
    benefit("↻","Preparado para el nuevo Plan General","Muestra el planeamiento vigente y, aparte, el que esté en tramitación, para que nadie los confunda.")+
    '<div class="src">'+esc(D.instrumento.nota)+'</div>'+
    '<div class="btn-row"><button class="btn btn-primary" type="button" id="again">Repetir la demostración</button></div>';
  bindBack("toInicio", renderInicio);
  bindBack("again", function(){ startCase(D.casos[0].id); });
  scrollTop();
}
function benefit(i,t,d){ return '<div class="benefit"><span class="ico" aria-hidden="true">'+i+'</span><div><b>'+t+'</b><div class="muted">'+d+'</div></div></div>'; }

function renderLibre0(){
  state = {view:"libre", caso:null, paso:0};
  mostrarContorno(null); setBase("orto"); setCatastro(true);
  panel.innerHTML =
    '<button class="back" type="button" id="toInicio">← Volver al inicio</button>'+
    '<span class="qnum">Exploración libre</span>'+
    '<h2>Toque cualquier punto del mapa</h2>'+
    '<p>Acerque el mapa y toque una parcela. En el visor final aparecerá toda su información urbanística, igual que en los ejemplos.</p>';
  bindBack("toInicio", salirLibre);
}
function salirLibre(){ if(freeMarker){ map.removeLayer(freeMarker); freeMarker=null; } renderInicio(); }
function renderLibre(ll){
  var lat = ll.lat.toFixed(5), lng = ll.lng.toFixed(5);
  panel.innerHTML =
    '<button class="back" type="button" id="toInicio">← Volver al inicio</button>'+
    '<span class="qnum">Exploración libre</span><h2>Punto seleccionado</h2>'+
    '<div class="list">'+
      item("Coordenadas", lat+", "+lng, "La posición exacta del punto que ha tocado.", {real:true, fuente:"El propio mapa."})+
      '<details class="item"><summary><span class="k">Referencia catastral</span><span class="v" id="rc">Consultando al Catastro…</span></summary><div class="more"><div><b>¿De dónde sale?</b> Sede Electrónica del Catastro, consultada en directo.</div></div></details>'+
    '</div>'+
    '<p class="muted">El resto de la información (tipo de suelo, afecciones y qué se puede hacer) se mostrará aquí en el visor final, como en los 5 ejemplos.</p>'+
    '<div class="btn-row"><button class="btn btn-ghost" type="button" id="verEj">Ver un ejemplo completo</button></div>';
  bindBack("toInicio", salirLibre);
  bindBack("verEj", function(){ if(freeMarker){ map.removeLayer(freeMarker); freeMarker=null; } startCase(D.casos[0].id); });
  consultaCatastro(ll.lat, ll.lng);
}
function consultaCatastro(lat,lng){
  var rcEl = document.getElementById("rc");
  function pon(h){ if(document.body.contains(rcEl)) rcEl.innerHTML = h; }
  var url = "https://ovc.catastro.meh.es/OVCServWeb/OVCWcfCallejero/COVCCoordenadas.svc/json/Consulta_RCCOOR?SRS=EPSG:4326&Coordenada_X="+lng+"&Coordenada_Y="+lat;
  var ctrl = ("AbortController" in window) ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 7000);
  fetch(url, ctrl ? {signal:ctrl.signal} : {}).then(function(r){ return r.json(); }).then(function(j){
    clearTimeout(timer);
    var res = j && (j.Consulta_RCCOORResult || j);
    var co = res && res.coordenadas && res.coordenadas.coord; if(Array.isArray(co)) co = co[0];
    if(!co || !co.pc){ pon("Sin parcela catastral en este punto"); return; }
    pon(esc((co.pc.pc1||"")+(co.pc.pc2||""))+tagReal());
  }).catch(function(){ clearTimeout(timer); pon("Disponible en el visor final"); });
}

/* ================= Informe / ficha completa ================= */
function fila(k,v,real){ return '<tr><th>'+esc(k)+'</th><td>'+esc(v)+(real?'':' <small class="muted">[ejemplo]</small>')+'</td></tr>'; }
function sec(t){ return '<tr class="sec"><td colspan="2">'+esc(t)+'</td></tr>'; }
function openReport(c){
  var hoy = new Date().toLocaleDateString("es-ES");
  var filas =
    sec("1. Ubicación")+
    '<tr><th>Lugar</th><td>'+esc(c.lugar)+(c.real?'':' <small class="muted">[ubicación ilustrativa]</small>')+'<br><small class="muted">'+c.coords[0].toFixed(5)+', '+c.coords[1].toFixed(5)+(c.real?' · Fuente: '+esc(c.real.lugar):'')+'</small></td></tr>'+
    c.parcela.map(function(p){ return fila(p[0],p[1]); }).join("")+
    sec("2. Tipo de suelo")+
    fila("Clase de suelo", c.suelo.clase)+fila("Zona", c.suelo.zona)+fila("Explicación", c.suelo.explicacion)+
    (c.gestion ? c.gestion.map(function(g){ return fila(g.hito, ESTADO_TXT[g.estado]+" · "+g.detalle); }).join("") : "")+
    sec("3. Afecciones")+
    c.afecciones.map(function(a){ return fila(a.nombre, ESTADO_TXT[a.estado]+". "+a.detalle); }).join("")+
    sec("4. Qué se puede hacer")+
    c.puede.map(function(q){ return fila(q.pregunta, q.detalle); }).join("")+
    c.parametros.map(function(p){ return fila(p[0],p[1]); }).join("")+
    '<tr><th>'+esc(c.calculo.titulo)+'</th><td>'+c.calculo.pasos.map(esc).join("<br>")+' <small class="muted">[ejemplo]</small></td></tr>'+
    '<tr><th>Trámites</th><td>'+c.tramites.map(esc).join("<br>")+' <small class="muted">[ejemplo]</small></td></tr>'+
    sec("5. Planeamiento de referencia")+
    '<tr><th>Instrumento vigente</th><td>'+esc(D.instrumento.nombre)+'. '+esc(D.instrumento.detalle)+'</td></tr>';
  reportEl.innerHTML =
    '<div class="sheet"><div class="watermark" aria-hidden="true">EJEMPLO</div>'+
    '<div class="muted" style="font-size:.8rem">UrbanGPT · Visor Urbanístico de Novelda · Informe orientativo</div>'+
    '<h3>Informe urbanístico de la parcela</h3>'+
    '<div class="muted">'+esc(c.lugar)+' · generado el '+hoy+'</div>'+
    '<div class="tbl"><table>'+filas+'</table></div>'+
    '<div class="foot"><b>DOCUMENTO DE DEMOSTRACIÓN, SIN VALIDEZ.</b> Los valores marcados como ejemplo no proceden del planeamiento de Novelda. '+
    'En el servicio contratado, cada dato incluirá su documento de origen, artículo y fecha. '+
    'El informe es orientativo y no sustituye a la cédula urbanística, la licencia ni los certificados municipales.</div>'+
    '<div class="sheet-actions">'+
      (EMBEBIDO ? '<span class="muted" style="align-self:center;font-size:.86rem">En el visor final, este informe se descarga en PDF.</span>'
                : '<button class="btn btn-primary" type="button" id="printR">Imprimir o guardar PDF</button>')+
      '<button class="btn btn-ghost" type="button" id="closeR">Cerrar</button></div></div>';
  reportEl.hidden = false;
  bindBack("printR", function(){ window.print(); });
  bindBack("closeR", closeReport);
  document.getElementById("closeR").focus();
}
function closeReport(){ reportEl.hidden = true; }
reportEl.addEventListener("click",function(e){ if(e.target===reportEl) closeReport(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeReport(); });
document.getElementById("homeBtn").onclick = function(){ closeReport(); if(freeMarker){map.removeLayer(freeMarker);freeMarker=null;} renderInicio(); };

renderInicio();
})();
</script>
